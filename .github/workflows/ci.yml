name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ python3-dev
      - name: Build
        run: make all
      - name: Correctness suite (kernels + transformer + batching)
        run: |
          ./build/test_infer
          ./build/test_model
