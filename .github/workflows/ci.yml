name: ci

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++
      - name: Build (all binaries)
        run: make -j2 all
      - name: Kernel correctness suite (37 checks)
        run: ./build/test_infer
      - name: System suite (transformer / tokenizer / spec-decode / batching)
        run: ./build/test_model
      - name: Benchmark smoke (roofline table + batching goodput)
        run: |
          ./build/bench_matmul
          ./build/bench_batch 4
